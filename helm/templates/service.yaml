{{- if .Values.service.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "finperk-worker.fullname" . }}
  labels:
    {{- include "finperk-worker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "finperk-worker.selectorLabels" . | nindent 4 }}
{{- end }}
