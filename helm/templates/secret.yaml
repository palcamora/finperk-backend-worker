{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "finperk-worker.fullname" . }}-secrets
  labels:
    {{- include "finperk-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGODB_URI: {{ .Values.secrets.mongodbUri | quote }}
  GOCARDLESS_SECRET_ID: {{ .Values.secrets.gocardlessSecretId | quote }}
  GOCARDLESS_SECRET_KEY: {{ .Values.secrets.gocardlessSecretKey | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  JEV_API_KEY: {{ .Values.secrets.jevApiKey | quote }}
  SMTP_USER: {{ .Values.secrets.smtpUser | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
{{- end }}
