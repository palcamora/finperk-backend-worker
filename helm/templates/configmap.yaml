apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finperk-worker.fullname" . }}-config
  labels:
    {{- include "finperk-worker.labels" . | nindent 4 }}
data:
  WORKER_HEALTH_PORT: {{ .Values.config.workerHealthPort | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  NATS_URL: {{ .Values.config.natsUrl | quote }}
  GOCARDLESS_TOKEN_STORE: {{ .Values.config.gocardlessTokenStore | quote }}
  JEV_PROVIDER: {{ .Values.config.jevProvider | quote }}
  JEV_MODEL: {{ .Values.config.jevModel | quote }}
  JEV_API_URL: {{ .Values.config.jevApiUrl | quote }}
  SCHEDULER_INTERVAL: {{ .Values.config.schedulerInterval | quote }}
  NOTIFICATIONS_ENABLED: {{ .Values.config.notificationsEnabled | quote }}
  SMTP_HOST: {{ .Values.config.smtpHost | quote }}
  SMTP_PORT: {{ .Values.config.smtpPort | quote }}
  SMTP_FROM: {{ .Values.config.smtpFrom | quote }}
  APNS_KEY_ID: {{ .Values.config.apnsKeyId | quote }}
  APNS_TEAM_ID: {{ .Values.config.apnsTeamId | quote }}
